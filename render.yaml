services:
  - type: web
    name: chainseer-api
    runtime: docker
    region: frankfurt
    plan: starter
    numInstances: 1
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    disk:
      name: chainseer-timechain
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: CHAINSEER_ENVIRONMENT
        value: production
      - key: CHAINSEER_API_TOKEN
        sync: false
      - key: CHAINSEER_RPC_URL
        value: https://rpc.mainnet.chain.robinhood.com
      - key: CHAINSEER_BASE_RPC_URL
        sync: false
      - key: CHAINSEER_SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: CHAINSEER_CHAIN_ROOT
        value: /data/chainseer_chain
      - key: CHAINSEER_SKILL_DIR
        value: /opt/cypher-tempre-self-model
      - key: CHAINSEER_ALLOWED_ORIGINS
        value: https://usechainseer.com,https://www.usechainseer.com
      - key: CHAINSEER_ALLOWED_HOSTS
        value: "*.onrender.com,api.usechainseer.com"
      - key: CHAINSEER_QUEUE_SIZE
        value: "20"
      - key: CHAINSEER_RATE_LIMIT_PER_MINUTE
        value: "6"
      - key: CHAINSEER_SCAN_CACHE_TTL_SECONDS
        value: "300"
      - key: CHAINSEER_RESULT_TTL_SECONDS
        value: "600"
      - key: CHAINSEER_SHUTDOWN_GRACE_SECONDS
        value: "20"
      - key: CHAINSEER_WATCHER_ENABLED
        value: "1"
      - key: CHAINSEER_WATCHER_INTERVAL_SECONDS
        value: "60"
      - key: CHAINSEER_WATCHER_CONFIRMATIONS
        value: "2"
      - key: CHAINSEER_BENCHMARK_CAPTURE_ENABLED
        value: "1"
      - key: CHAINSEER_BENCHMARK_ROOT
        value: /data/benchmark
      - key: CHAINSEER_BENCHMARK_ROBINHOOD_COHORT
        value: robinhood_public_analysis
      - key: CHAINSEER_BENCHMARK_SOLANA_COHORT
        value: solana_public_analysis
      - key: CHAINSEER_BENCHMARK_BASE_COHORT
        value: base_public_analysis
      - key: CT_AUTOGROW
        value: "1"
      - key: CT_PROMOTE_AT
        value: "1"
      - key: CT_AUTOGROW_MIN_SALIENCE
        value: "170"
      - key: CT_SEMANTIC_GAP
        value: "1"
      - key: CT_IMMUNE_FAILCLOSED
        value: "1"
      - key: CT_AUTO_QUARANTINE
        value: "1"
