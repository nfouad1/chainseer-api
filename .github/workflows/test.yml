name: Test production API

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-test.txt

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt

      # Repinned to the runtime this estate actually runs. A pin that names a
      # different build than production tests code nobody is running, which is
      # the one failure mode a pin exists to prevent.
      #
      # The codex path is kept deliberately: the fork's codex and claude
      # runtimes share all 53 python modules byte-for-byte, differing only by
      # codex's install_codex_hooks.py, which is an installer rather than part
      # of the verified surface. Production runs the claude variant.
      - name: Install pinned Cypher Tempre runtime
        env:
          CYPHER_TEMPRE_REPO: FrostedFlaming0/cypher-tempre-tcaFork
          CYPHER_TEMPRE_ARCHIVE: cypher-tempre-tcaFork
          CYPHER_TEMPRE_COMMIT: 963ee364718e369718a2d8b15754305ae28806c5
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/${CYPHER_TEMPRE_REPO}/archive/${CYPHER_TEMPRE_COMMIT}.zip" \
            --output "$RUNNER_TEMP/cypher-tempre.zip"
          python -m zipfile -e \
            "$RUNNER_TEMP/cypher-tempre.zip" \
            "$RUNNER_TEMP/cypher-tempre"
          echo "CHAINSEER_SKILL_DIR=$RUNNER_TEMP/cypher-tempre/${CYPHER_TEMPRE_ARCHIVE}-${CYPHER_TEMPRE_COMMIT}/skills/codex/cypher-tempre-self-model" \
            >> "$GITHUB_ENV"

      - name: Compile
        run: >-
          python -X utf8 -m py_compile
          chainseer.py
          chainseer_controls.py
          chainseer_solana_public.py
          chainseer_api.py

      - name: Unit tests
        run: python -X utf8 -m unittest discover -s tests -v

      - name: Build production container
        run: docker build --file Dockerfile.api --tag chainseer-api:test .
