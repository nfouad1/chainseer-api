name: Chainseer CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: python -m pip install --requirement requirements-api.txt
      - run: python -m unittest discover -s tests -v

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chainseer_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: chainseer_web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --test tests/rendered-html.test.mjs
