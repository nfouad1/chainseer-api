app = "chainseer-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.api"

[processes]
  gateway = "env CHAINSEER_PROCESS_ROLE=gateway python -X utf8 chainseer_api.py"
  writer = "env CHAINSEER_PROCESS_ROLE=writer python -X utf8 chainseer_api.py"

[env]
  CHAINSEER_ENVIRONMENT = "production"
  CHAINSEER_RPC_URL = "https://rpc.mainnet.chain.robinhood.com"
  CHAINSEER_SOLANA_RPC_URL = "https://api.mainnet-beta.solana.com"
  CHAINSEER_CHAIN_ROOT = "/data/chainseer_chain"
  CHAINSEER_SKILL_DIR = "/opt/cypher-tempre-self-model"
  CHAINSEER_FACULTY_PACK_PATH = "/app/faculties/chainseer-production-v1.json"
  CHAINSEER_ALLOWED_ORIGINS = "https://usechainseer.com,https://www.usechainseer.com"
  CHAINSEER_ALLOWED_HOSTS = "*.fly.dev,api.usechainseer.com,writer.process.chainseer-api.internal"
  CHAINSEER_QUEUE_SIZE = "20"
  CHAINSEER_RATE_LIMIT_PER_MINUTE = "6"
  CHAINSEER_GLOBAL_RATE_LIMIT_PER_MINUTE = "60"
  CHAINSEER_SCAN_CACHE_TTL_SECONDS = "300"
  CHAINSEER_STALE_RESULT_TTL_SECONDS = "86400"
  CHAINSEER_RESULT_TTL_SECONDS = "600"
  CHAINSEER_SHUTDOWN_GRACE_SECONDS = "20"
  CHAINSEER_FULL_AUDIT_INTERVAL_SECONDS = "900"
  CHAINSEER_MEMORY_WARNING_MB = "1536"
  # The user-facing API must not retain three-chain watcher scan allocations.
  # Watchers run separately; this process owns only interactive analysis.
  CHAINSEER_WATCHER_ENABLED = "0"
  # The legacy global projection is rebuildable but too large to parse in a
  # 2 GiB request process. Keep authoritative Timechain evidence enabled.
  CHAINSEER_TEMPORAL_PROJECTION_ENABLED = "0"
  # CPU-heavy cognitive completion belongs in the isolated learner, not the
  # single-vCPU interactive API. The immutable evidence seal remains enabled.
  CHAINSEER_COGNITIVE_COMPLETION_ENABLED = "0"
  # Shared cross-replica job state is opt-in. Configure the URL as a Fly
  # secret before adding API replicas; never commit it here.
  CHAINSEER_SHARED_STORE_PREFIX = "chainseer"
  CHAINSEER_SHARED_STORE_TIMEOUT_SECONDS = "2"
  CHAINSEER_SHARED_WORK_QUEUE_ENABLED = "1"
  CHAINSEER_WRITER_LEASE_TTL_SECONDS = "30"
  CHAINSEER_WRITER_INTERNAL_URL = "http://writer.process.chainseer-api.internal:8000"
  CHAINSEER_WRITER_PROXY_TIMEOUT_SECONDS = "30"
  CHAINSEER_WATCHER_INTERVAL_SECONDS = "60"
  CHAINSEER_WATCHER_CONFIRMATIONS = "2"
  CHAINSEER_BENCHMARK_CAPTURE_ENABLED = "1"
  CHAINSEER_BENCHMARK_ANALYZER_VERSION = "chainseer-fly-2026.08.12-resilient-scan-v6"
  CHAINSEER_BENCHMARK_ROOT = "/data/benchmark"
  CHAINSEER_BENCHMARK_ROBINHOOD_COHORT = "robinhood_public_analysis"
  CHAINSEER_BENCHMARK_SOLANA_COHORT = "solana_public_analysis"
  CHAINSEER_BENCHMARK_BASE_COHORT = "base_public_analysis"
  CT_AUTOGROW = "1"
  CT_PROMOTE_AT = "1"
  CT_AUTOGROW_MIN_SALIENCE = "170"
  CT_SEMANTIC_GAP = "1"
  CT_IMMUNE_FAILCLOSED = "1"
  CT_AUTO_QUARANTINE = "1"

[[mounts]]
  source = "chainseer_timechain"
  destination = "/data"
  processes = ["writer"]

[http_service]
  processes = ["gateway"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  processes = ["gateway"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["writer"]
  size = "performance-1x"
  memory = "2048mb"
